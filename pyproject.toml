[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rbx-asset-ledger"
version = "0.1.0"
description = "Offline Roblox asset-reference inventory and allowlist checks for Luau and XML projects"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{name = "KayaCan"}]
keywords = ["roblox", "luau", "assets", "audit", "security", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
rbx-asset-ledger = "rbx_asset_ledger.cli:main"

[tool.setuptools.packages.find]
include = ["rbx_asset_ledger*"]
